(function() {
    try {
        const offset = 160;
        const parentHeight = window.parent.innerHeight;
        const iframes = window.parent.document.querySelectorAll('iframe');
        for (const iframe of iframes) {
            if (iframe.contentWindow === window) {
                iframe.style.height = Math.max(parentHeight - offset, 400) + 'px';
                iframe.style.width = '100%';
                break;
            }
        }
    } catch(e) {}
})();</script>

<script>
(function() {
    const svg = document.querySelector("svg");
    let isPanning = false;
    let startX, startY;
    let viewBox = svg.getAttribute("viewBox").split(" ").map(Number);

    svg.addEventListener("mousedown", e => {
        isPanning = true;
        startX = e.clientX;
        startY = e.clientY;
    });

    svg.addEventListener("mousemove", e => {
        if (!isPanning) return;
        const dx = startX - e.clientX;
        const dy = startY - e.clientY;
        viewBox[0] += dx;
        viewBox[1] += dy;
        svg.setAttribute("viewBox", viewBox.join(" "));
        startX = e.clientX;
        startY = e.clientY;
    });

    svg.addEventListener("mouseup", () => isPanning = false);
    svg.addEventListener("mouseleave", () => isPanning = false);

    svg.addEventListener("wheel", e => {
        e.preventDefault();
        const scale = 1.1;
        const zoomFactor = e.deltaY < 0 ? 1/scale : scale;
        viewBox[2] *= zoomFactor;
        viewBox[3] *= zoomFactor;
        svg.setAttribute("viewBox", viewBox.join(" "));
    });
})();
</script>
